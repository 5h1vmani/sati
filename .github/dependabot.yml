# Dependabot opens one pull request a month for each ecosystem.
# A dependency update can change the release APK, so the release
# checklist runs tools/repro_check.sh before every release.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
