# Dependabot opens one pull request a month for the GitHub Actions in CI.
# Gradle libraries are not here. An update can change the release APK, so
# libraries are updated on purpose, once per release cycle (D-17).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
