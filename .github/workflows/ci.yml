# Runs on every push and pull request: unit tests, lint, the colour
# contrast check, and an unsigned release build.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Colour contrast (WCAG AA)
        run: python3 tools/contrast.py

      - name: Unit tests, lint, release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: sati-release-unsigned
          path: app/build/outputs/apk/release/*.apk
