# Runs on every push and pull request: unit tests, lint, the colour
# contrast check, the permissions doc check and an unsigned release build.
# The job name "build" is a required check on main. Renaming it blocks merges.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Colour contrast (WCAG AA)
        run: python3 tools/contrast.py

      - name: Permissions doc and exported components
        run: python3 tools/check_permissions.py

      - name: Unit tests, lint, release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sati-release-unsigned
          path: app/build/outputs/apk/release/*.apk
