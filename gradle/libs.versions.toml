# Versions are the ones the ferry project already uses and Gradle has cached.
# See ferry/android/gradle/libs.versions.toml for where each was checked.
# composeBom 2026.06.01 is the newest BOM whose Compose UI still builds
# against compileSdk 36.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"
# Room 2.8 and KSP 2.3 were the newest on 5 Nov 2026. KSP 2.3 no longer
# ties its version to the Kotlin version.
room = "2.8.5"
ksp = "2.3.13"
orgJson = "20260814"
# Instrumented tests only. Newest stable on Google Maven on 7 Nov 2026.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# room-testing reads the schema files with kotlinx-serialization 1.8.1. The app
# gets 1.7.3 through Compose, and the test APK must use the app's versions.
# So debug builds get 1.8.1. Release builds keep 1.7.3.
kotlinxSerialization = "1.12.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Android's org.json classes are stubs in plain unit tests. This is the real library.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android plugin: AGP 9's built-in Kotlin compiles the sources.
# The Compose compiler plugin is still needed.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
